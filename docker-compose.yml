services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reporeveal
      POSTGRES_PASSWORD: reporeveal
      POSTGRES_DB: reporeveal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporeveal -d reporeveal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://reporeveal:reporeveal@db:5432/reporeveal
      CORS_ORIGINS: http://localhost:3000
      TEMP_DIR: /tmp/reporeveal
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_tmp:/tmp/reporeveal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_DEMO_REPOSITORY_URL: https://github.com/pallets/click
      NEXT_PUBLIC_GITHUB_REPO_URL: https://github.com/androodo/RepoReveal
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  backend_tmp:
